<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Exter AI sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Main" style="font-family: Inter, sans-serif; color: #1F2937; box-sizing: border-box; width: 100%; padding: 24px 12px; display: flex; flex-direction: column; gap: 14px; background: #FFFFFF">
<div style="padding: 0 12px; display: flex; align-items: baseline; gap: 6px"><span style="font-size: 24px; font-weight: 700; letter-spacing: -0.8px; color: #0C1F96">EXTER</span><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #0C1F96">AI</span></div>
<button type="button" aria-label="Switch brand" style="width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; min-height: 56px; border: 1px solid #E5E7EB; border-radius: 8px; background: #FFFFFF; text-align: left; font: inherit; color: #1F2937; cursor: pointer">
<span style="flex: 0 0 32px; height: 32px; border-radius: 8px; background: #F3F4F6; border: 1px solid #E5E7EB; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">N</span>
<span style="display: flex; flex-direction: column; min-width: 0; flex: 1"><span style="font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Northwick Candle Co.</span><span style="font-size: 12px; color: #515B6B">Client · 5 competitors</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="padding: 6px 12px 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #515B6B">{{g.label}}</div>
<sc-for list="{{g.items}}" as="item" hint-placeholder-count="3">
<a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{item.d1}}"></path><path d="{{item.d2}}"></path><path d="{{item.d3}}"></path></svg><span>{{item.label}}</span><span style="{{item.dotStyle}}" aria-hidden="true"></span></a>
</sc-for>
</div>
</sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["home","brands","competitors","creatives","formats","patterns","audience","winners","briefs","creators","scores","reports","ask","data"],"default":"home"},"$preview":{"width":240,"height":980}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'home';
    const base = 'display: flex; align-items: center; gap: 10px; padding: 0 12px; min-height: 44px; border-radius: 8px; text-decoration: none; font-size: 14px;';
    const on = base + ' background: #E6F9FA; color: #0C1F96; font-weight: 600;';
    const off = base + ' color: #1F2937; font-weight: 500;';
    const mk = (id, label, href, d1, d2, d3, dot) => ({
      label, href, d1, d2: d2 || '', d3: d3 || '',
      style: id === active ? on : off,
      current: id === active ? 'page' : 'false',
      dotStyle: dot ? 'margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: ' + dot : 'display: none'
    });
    return {
      groups: [
        { label: 'Overview', items: [
          mk('home', 'Home', 'Main.dc.html', 'M3 11l9-7 9 7', 'M5 10v10h14V10')
        ] },
        { label: 'Research', items: [
          mk('brands', 'Brand research', 'Brands.dc.html', 'M4 21V9l8-5 8 5v12', 'M9 21v-6h6v6'),
          mk('competitors', 'Competitors', 'Competitors.dc.html', 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z'),
          mk('creatives', 'Creatives', 'Creatives.dc.html', 'M3 3h7v7H3z M14 3h7v7h-7z', 'M3 14h7v7H3z M14 14h7v7h-7z'),
          mk('formats', 'Formats', 'Formats.dc.html', 'M12 3l9 5-9 5-9-5z', 'M3 13l9 5 9-5'),
          mk('patterns', 'Patterns', 'Patterns.dc.html', 'M5 20V11', 'M12 20V4', 'M19 20v-6'),
          mk('audience', 'Audience & voice', 'Audience.dc.html', 'M4 5h16v11H9l-5 4z', 'M8 9h8 M8 12h5')
        ] },
        { label: 'Act', items: [
          mk('winners', 'Winners', 'Winners.dc.html', 'M7 4h10v5a5 5 0 0 1-10 0z', 'M7 6H4a3 3 0 0 0 3 4 M17 6h3a3 3 0 0 1-3 4', 'M12 14v4 M8 21h8'),
          mk('briefs', 'Opportunities & briefs', 'Briefs.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z', 'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8z'),
          mk('creators', 'Creators', 'Creators.dc.html', 'M12 4a4 4 0 1 0 0 8a4 4 0 1 0 0-8z', 'M4 21c0-4 4-6 8-6s8 2 8 6'),
          mk('scores', 'Scores', 'Scores.dc.html', 'M4 17a8 8 0 0 1 16 0', 'M12 17l4-5')
        ] },
        { label: 'Share', items: [
          mk('reports', 'Reports', 'Reports.dc.html', 'M4 4h16v16H4z', 'M8 16v-4 M12 16V8 M16 16v-6'),
          mk('ask', 'Ask Exter', 'Ask.dc.html', 'M4 5h16v11H9l-5 4z', 'M10 9a2 2 0 1 1 3 1.7c-.7.4-1 .9-1 1.6', 'M12 14.5v.01')
        ] },
        { label: 'Settings', items: [
          mk('data', 'Data sources', 'DataSources.dc.html', 'M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3z', 'M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6', 'M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3', '#E5A50A')
        ] }
      ]
    };
  }
}
</script>
</body>
</html>
