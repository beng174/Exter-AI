# Disk-backed services require paid Render plans. This does not upgrade an existing service automatically.
services:
  - type: web
    name: exter-ai
    runtime: docker
    plan: starter
    branch: exter-test-drive
    dockerfilePath: ./Dockerfile
    # No unauthenticated health endpoint: every HTTP route is protected.
    disk:
      name: exter-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXTER_ADMIN_USER
        sync: false
      - key: EXTER_ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_VIDEO_MODEL
        sync: false
      - key: GEMINI_REQUEST_RESERVE_GBP
        sync: false
      - key: GEMINI_INPUT_GBP_PER_MILLION_TOKENS
        sync: false
      - key: GEMINI_OUTPUT_GBP_PER_MILLION_TOKENS
        sync: false
      - key: GEMINI_VIDEO_CONCURRENCY
        value: "3"
      - key: GEMINI_MAX_RETRIES
        value: "2"
      - key: GEMINI_GENERATION_SEED
        value: "42"
      - key: GEMINI_MEDIA_RESOLUTION
        value: default
      # Optional: bind existing GBP rates to the served model with GEMINI_PRICING_MODEL,
      # or add exact served-model rates in GEMINI_MODEL_PRICING_GBP_JSON.
      - key: CHROMIUM_PATH
        value: /usr/bin/chromium
      # META_ACCESS_TOKEN: secure environment setting on web and worker only.
      - key: EXTER_META_LIBRARY_ENABLED
        value: "false"
      - key: META_API_VERSION
        value: v26.0
      - key: MEDIA_STORAGE_TYPE
        value: disk
      - key: MEDIA_STORAGE_PATH
        value: /var/data/media
      - key: EXTER_BACKUPS_ENABLED
        value: "true"
      - key: EXTER_DB_PATH
        value: /var/data/exter.db
      - key: DATABASE_URL
        fromDatabase:
          name: exter-postgres
          property: connectionString
  - type: worker
    name: exter-worker
    runtime: docker
    plan: starter
    branch: exter-test-drive
    dockerCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXTER_KERNEL_WORKER_ENABLED
        value: "false"
      # Optional artifact staging is configured separately. The web disk is not shared.
      # Web+worker: EXTER_ARTIFACT_BROKER_TOKEN (secure); web: EXTER_ARTIFACT_BROKER_WORKSPACES.
      # Worker: EXTER_ARTIFACT_BROKER_ORIGIN and EXTER_KERNEL_CACHE_PATH.
      # META_ACCESS_TOKEN: secure environment setting, never committed.
      - key: EXTER_META_LIBRARY_ENABLED
        value: "false"
      - key: META_API_VERSION
        value: v26.0
      - key: DATABASE_URL
        fromDatabase:
          name: exter-postgres
          property: connectionString
  - type: cron
    name: exter-scheduler
    runtime: docker
    branch: exter-test-drive
    # Probe both UTC times; application enqueues once at 03:00 Europe/London.
    schedule: "0 2,3 * * *"
    dockerCommand: npm run scheduler
    envVars:
      - key: EXTER_META_LIBRARY_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: exter-postgres
          property: connectionString

databases:
  - name: exter-postgres
    plan: basic-256mb
    postgresMajorVersion: "17"
    diskSizeGB: 5
